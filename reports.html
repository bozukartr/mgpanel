<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Raporlar · Hotizy</title>
    <link rel="stylesheet" href="css/modules/reports.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/core/embed.css">
    <script src="js/core/embed.js"></script>
</head>

<body class="rep-body">
    <main class="rep-wrap">
        <!-- ── Filters (compact builder) ── -->
        <aside class="rep-side">
            <div class="rep-side-head">
                <h1>Raporlar</h1>
                <p>Kaynağı seçip filtreleri birleştirin; istediğiniz raporu oluşturun.</p>
            </div>

            <div class="rep-f">
                <label class="rep-l">Rapor Kaynağı</label>
                <select id="repDomain" class="rep-in"></select>
            </div>

            <div class="rep-f">
                <label class="rep-l">Tarih Aralığı</label>
                <select id="repDatePreset" class="rep-in">
                    <option value="all">Tüm Zamanlar</option>
                    <option value="today">Bugün</option>
                    <option value="yesterday">Dün</option>
                    <option value="7">Son 7 Gün</option>
                    <option value="30">Son 30 Gün</option>
                    <option value="thismonth">Bu Ay</option>
                    <option value="lastmonth">Geçen Ay</option>
                    <option value="custom">Özel Aralık</option>
                </select>
                <div class="rep-row" id="repCustomDates" style="display:none;">
                    <input type="date" id="repFrom" class="rep-in">
                    <input type="date" id="repTo" class="rep-in">
                </div>
            </div>

            <!-- Domain-specific facets injected here -->
            <div id="repFacets"></div>

            <div class="rep-f">
                <label class="rep-l">Gruplama</label>
                <select id="repGroupBy" class="rep-in"></select>
            </div>

            <button class="rep-reset" id="repReset">Filtreleri Sıfırla</button>
        </aside>

        <!-- ── Result / preview ── -->
        <section class="rep-main">
            <div class="rep-top">
                <div class="rep-top-l">
                    <div class="rep-title" id="repTitle">Tüm Kayıtlar</div>
                    <div class="rep-sub" id="repRangeLabel">Tüm Zamanlar</div>
                </div>
                <div class="rep-actions">
                    <button class="rep-btn ghost" id="repPrint">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                        Yazdır
                    </button>
                    <button class="rep-btn primary" id="repExcel">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="12" y1="12" x2="12" y2="18"/></svg>
                        Excel İndir
                    </button>
                </div>
            </div>

            <div class="rep-stats" id="repStats"></div>

            <div class="rep-tablewrap">
                <div class="rep-table-scroll" id="repTableScroll"></div>
            </div>
        </section>
    </main>

    <div id="toast" class="rep-toast"></div>

    <!-- Firebase + app -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="js/core/firebase-config.js"></script>
    <script src="js/core/pwa.js"></script>
    <script src="js/core/monitor.js"></script>
    <script src="js/core/maintenance-guard.js"></script>
    <script src="js/core/modules.js"></script>
    <script src="js/core/issue-config.js"></script>
    <script src="js/modules/reports.js"></script>
</body>

</html>
