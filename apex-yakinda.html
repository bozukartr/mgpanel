<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çok Yakında · StayOS</title>
<meta name="description" content="StayOS — modern, çok otelli otel yönetim platformu. Çok yakında.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Outfit', system-ui, sans-serif; color: #0f172a; min-height: 100vh;
        display: flex; align-items: center; justify-content: center; padding: 28px; text-align: center;
        background:
            radial-gradient(900px 520px at 50% -10%, rgba(99,102,241,.18), transparent 60%),
            radial-gradient(700px 420px at 88% 112%, rgba(6,182,212,.14), transparent 60%),
            #f7f9fc;
    }
    .box { max-width: 560px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; margin-bottom: 30px; }
    .brand img { height: 30px; }
    .badge {
        display: inline-block; padding: 7px 15px; border-radius: 999px; font-size: 12.5px; font-weight: 700; letter-spacing: .4px;
        background: #eef2ff; color: #4f46e5; margin-bottom: 18px; text-transform: uppercase;
    }
    h1 { font-size: 38px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin-bottom: 16px;
        background: linear-gradient(120deg, #4f46e5, #6366f1 55%, #06b6d4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    p { font-size: 16.5px; color: #5b6b85; line-height: 1.6; max-width: 460px; margin: 0 auto; }
    .cta { margin-top: 30px; display: inline-flex; align-items: center; gap: 9px; padding: 14px 24px; border-radius: 14px;
        background: linear-gradient(120deg, #4f46e5, #6366f1); color: #fff; font-weight: 700; font-size: 15px; text-decoration: none;
        box-shadow: 0 14px 34px rgba(79,70,229,.32); transition: transform .12s; }
    .cta:active { transform: scale(.98); }
    .dots { display: flex; gap: 7px; justify-content: center; margin-top: 34px; }
    .dots span { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; animation: pulse 1.4s infinite; }
    .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.25); background: #6366f1; } }
    .foot { margin-top: 30px; font-size: 12.5px; color: #94a3b8; }
</style>
</head>
<body>
    <div class="box">
        <div class="brand"><img src="logo.png" alt="StayOS">StayOS</div>
        <div class="badge">Çok Yakında</div>
        <h1>Yeni nesil otel yönetimi geliyor</h1>
        <p>Rezervasyon, concierge, CRM ve departman talep akışını tek modern panelde toplayan StayOS çok yakında sizlerle.</p>
        <a class="cta" href="mailto:iletisim@stayos.org?subject=StayOS%20Bilgi%20Talebi">Bilgi Al →</a>
        <div class="dots"><span></span><span></span><span></span></div>
        <div class="foot">© <span id="y"></span> StayOS · Otel Yönetim Platformu</div>
    </div>
    <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
