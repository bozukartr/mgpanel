<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090c12">
<title>Çok Yakında · Hotizy</title>
<meta name="description" content="Hotizy — modern, çok otelli otel yönetim platformu. Çok yakında.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink: #f4f5f8; --muted: #8a92a6; --faint: #565d70; --accent: #818cf8; --line: rgba(255,255,255,.08); }
    html, body { height: 100%; }
    body {
        font-family: 'Outfit', system-ui, -apple-system, sans-serif; color: var(--ink);
        background: #090c12; -webkit-font-smoothing: antialiased; overflow: hidden;
        min-height: 100svh; display: flex; position: relative;
    }
    body::before { content: ''; position: absolute; inset: 0; pointer-events: none;
        background:
            radial-gradient(80% 52% at 50% -10%, rgba(99,102,241,.14), transparent 60%),
            radial-gradient(70% 60% at 100% 112%, rgba(6,182,212,.08), transparent 60%); }
    .wrap { position: relative; z-index: 1; width: 100%; max-width: 760px; margin: 0 auto;
        padding: clamp(26px, 6vh, 56px) clamp(24px, 6vw, 56px);
        display: flex; flex-direction: column; min-height: 100svh; }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 600; font-size: 16px; letter-spacing: .2px; }
    .brand img { height: 26px; width: auto; filter: brightness(0) invert(1); opacity: .92; }
    .center { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 600px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600;
        letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 26px; }
    .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
        box-shadow: 0 0 0 0 rgba(129,140,248,.5); animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { box-shadow: 0 0 0 0 rgba(129,140,248,.45); } 50% { box-shadow: 0 0 0 7px rgba(129,140,248,0); } }
    h1 { font-size: clamp(36px, 7.4vw, 62px); font-weight: 300; line-height: 1.03; letter-spacing: -1.6px; color: #fff; }
    h1 b { font-weight: 600; }
    p { margin-top: 22px; font-size: clamp(15px, 2.6vw, 17.5px); line-height: 1.65; color: var(--muted); max-width: 52ch; }
    .cta { margin-top: 40px; display: inline-flex; align-items: center; gap: 9px; align-self: flex-start;
        font-size: 15px; font-weight: 600; color: #fff; text-decoration: none; padding-bottom: 6px;
        border-bottom: 1px solid rgba(255,255,255,.22); transition: border-color .18s, gap .18s; }
    .cta:hover { border-color: var(--accent); gap: 13px; }
    .cta svg { width: 17px; height: 17px; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
        padding-top: 28px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--faint); }
    footer a { color: var(--muted); font-weight: 500; text-decoration: none; }
    footer a:hover { color: #fff; }
</style>
</head>
<body>
    <div class="wrap">
        <div class="brand"><img src="logo.png" alt="Hotizy">Hotizy</div>
        <div class="center">
            <span class="eyebrow"><span class="dot"></span>Çok Yakında</span>
            <h1>Yeni nesil<br><b>otel yönetimi.</b></h1>
            <p>Rezervasyon, concierge, CRM ve misafir talep akışını tek modern panelde toplayan Hotizy çok yakında sizlerle.</p>
            <a class="cta" href="mailto:bu.gol@outlook.com?subject=Hotizy%20Bilgi%20Talebi">
                Bilgi alın
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
            </a>
        </div>
        <footer>
            <span>© <span id="y"></span> Hotizy · Otel Yönetim Platformu</span>
            <a href="mailto:bu.gol@outlook.com">bu.gol@outlook.com</a>
        </footer>
    </div>
    <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
