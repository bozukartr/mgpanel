<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#090c12">
    <title>Bakım Çalışması · Hotizy</title>
    <link rel="icon" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --ink:#f4f5f8; --muted:#8a92a6; --faint:#565d70; --accent:#f5b042; --line:rgba(255,255,255,.09); }
        html, body { height: 100%; }
        body {
            font-family: 'Outfit', system-ui, -apple-system, sans-serif; color: var(--ink);
            background: #090c12; -webkit-font-smoothing: antialiased; min-height: 100svh;
            display: flex; align-items: center; justify-content: center; padding: 28px; position: relative; overflow: hidden;
        }
        body::before { content:''; position:absolute; inset:0; pointer-events:none;
            background:
                radial-gradient(80% 50% at 50% -10%, rgba(245,176,66,.10), transparent 60%),
                radial-gradient(70% 60% at 100% 112%, rgba(99,102,241,.08), transparent 60%); }
        .m-container { position: relative; z-index: 1; text-align: center; max-width: 540px; width: 100%; }
        .m-logo { width: 96px; height: auto; margin: 0 auto 26px; display: block; cursor: default; user-select: none;
            filter: brightness(0) invert(1); opacity: .92; }
        .m-eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600;
            letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
        .m-eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
            box-shadow: 0 0 0 0 rgba(245,176,66,.5); animation: breathe 2.4s ease-in-out infinite; }
        @keyframes breathe { 0%,100% { box-shadow: 0 0 0 0 rgba(245,176,66,.45); } 50% { box-shadow: 0 0 0 7px rgba(245,176,66,0); } }
        h1 { font-size: clamp(30px, 6vw, 44px); font-weight: 300; letter-spacing: -1px; line-height: 1.08; color: #fff; }
        #mMessage { font-size: 15.5px; color: var(--muted); margin: 16px auto 38px; line-height: 1.6; max-width: 42ch; }
        .m-countdown { display: flex; gap: 12px; justify-content: center; }
        .cd-block { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 16px; padding: 16px 10px; min-width: 80px; }
        .cd-block span { display: block; font-size: 34px; font-weight: 600; line-height: 1; color: #fff; letter-spacing: -1px; }
        .cd-block label { display: block; font-size: 10.5px; color: var(--faint); margin-top: 9px; text-transform: uppercase; letter-spacing: 1.5px; }
        .m-unlock { margin-top: 40px; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 18px; padding: 24px; text-align: left; }
        .m-unlock h3 { font-size: 11px; font-weight: 700; margin-bottom: 16px; color: var(--faint); text-transform: uppercase; letter-spacing: 1.4px; }
        .m-unlock input {
            width: 100%; padding: 13px 14px; margin-bottom: 10px; background: rgba(255,255,255,.05);
            border: 1px solid var(--line); border-radius: 11px; color: #fff; font-family: inherit; font-size: 14.5px; outline: none;
        }
        .m-unlock input:focus { border-color: #818cf8; }
        .m-unlock input::placeholder { color: var(--faint); }
        .m-unlock button {
            width: 100%; padding: 14px; background: var(--ink); color: #0b0f17; border: none; border-radius: 11px;
            font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; transition: background .2s;
        }
        .m-unlock button:hover { background: #fff; }
        .m-error { color: #fca5a5; font-size: 13px; margin-top: 10px; min-height: 18px; }
    </style>
</head>
<body>
    <div class="m-container">
        <img src="logo.png" alt="Logo" class="m-logo" id="mLogo" title="">
        <span class="m-eyebrow"><span class="dot"></span>Planlı Bakım</span>
        <h1>Kısa bir süreliğine<br>bakımdayız.</h1>
        <p id="mMessage">Sistem şu anda bakımdadır. Lütfen daha sonra tekrar deneyin.</p>

        <div class="m-countdown" id="mCountdown">
            <div class="cd-block"><span id="cdDays">00</span><label>Gün</label></div>
            <div class="cd-block"><span id="cdHours">00</span><label>Saat</label></div>
            <div class="cd-block"><span id="cdMins">00</span><label>Dakika</label></div>
            <div class="cd-block"><span id="cdSecs">00</span><label>Saniye</label></div>
        </div>

        <!-- Admin unlock (revealed on logo double-click) -->
        <div class="m-unlock" id="mUnlock" style="display:none;">
            <h3>Yönetici Erişimi</h3>
            <form id="mUnlockForm">
                <input type="text" id="mUser" placeholder="Kullanıcı Adı" autocomplete="username" required>
                <input type="password" id="mPass" placeholder="Şifre" autocomplete="current-password" required>
                <button type="submit">Giriş Yap</button>
                <div id="mError" class="m-error"></div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="js/core/firebase-config.js"></script>
    <script src="js/core/monitor.js"></script>
    <script src="js/modules/maintenance.js"></script>
</body>
</html>
