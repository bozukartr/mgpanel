<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Console | Core System</title>
    <!-- Mobile redirect -->
    <script>
        if (window.innerWidth <= 768 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
            window.location.replace('admin-mobile.html');
        }
    </script>
    <link rel="stylesheet" href="panel.css"> <!-- Reusing global tokens -->
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="mobilscreen.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-wrapper">
        <header class="admin-header">
            <div class="header-left">
                <span class="badge-admin">Root</span>
                <h1>Admin Console</h1>
            </div>
            <div class="header-right" style="display:flex; gap:10px; align-items:center;">
                <button id="adminEjectBtn" class="exit-btn" style="background:#dc2626; color:white; border:none; font-weight:600; display:flex; align-items:center; gap:6px; cursor:pointer;">💥 EJECT SYSTEM</button>
                <button onclick="window.location.href='crm.html'" class="exit-btn" style="background:#2563eb; color:white; border:none;">CRM Center</button>
                <button onclick="window.location.href='concierge.html'" class="exit-btn">Return to Dashboard</button>
            </div>
        </header>

        <!-- Subscription Banner -->
        <section class="admin-card subscription-banner" id="subscriptionBanner">
            <div class="sub-info">
                <div>
                    <span class="sub-label">Team Subscription</span>
                    <span id="subStatus" class="sub-status"></span>
                </div>
                <span id="subExpiry" class="sub-expiry"></span>
        </section>

        <div class="admin-grid">
            <!-- Left: User Management -->
            <section class="admin-card">
                <div class="card-header">
                    <h2>User Management</h2>
                    <button class="add-user-btn" id="openUserModal">+ Add User</button>
                </div>
                <div class="table-container">
                    <table id="usersTable">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Department</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Users will be listed here -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Right: System Activity or Settings -->
            <section class="admin-card">
                <div class="card-header">
                    <h2>System Activity</h2>
                </div>
                <div id="activityLogs" class="activity-logs">
                    <!-- Global logs from Firestore -->
                </div>
            </section>
        </div>

        <!-- Support Tickets -->
        <section class="admin-card" style="margin-top: 20px;">
            <div class="card-header">
                <h2>Support Tickets</h2>
                <button class="add-user-btn" id="openTicketModal">+ New Ticket</button>
            </div>
            <div id="ticketList" class="ticket-list">
                <!-- Tickets render here -->
            </div>
        </section>
    </div>

    <!-- User Management Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h3>User Settings</h3>
                <button class="close-modal" id="closeUserModal">&times;</button>
            </div>
            <form id="userForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="adminNewUsername" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="adminNewPassword" required>
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select id="adminUserRole">
                            <option value="Staff">Staff</option>
                            <option value="Manager">Manager</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Default Department</label>
                        <select id="adminUserDept">
                            <option value="Housekeeping">Housekeeping</option>
                            <option value="Front Desk">Front Desk</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Food & Beverage">Food & Beverage</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions vertical">
                    <button type="submit" class="action-btn save-btn">Save Permissions</button>
                </div>
            </form>
        </div>
    </div>

    <!-- New Ticket Modal -->
    <div id="ticketModal" class="modal">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h3>New Support Ticket</h3>
                <button class="close-modal" id="closeTicketModal">&times;</button>
            </div>
            <form id="ticketForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="ticketSubject" required>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="ticketPriority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea id="ticketMessage" rows="5" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit; font-size:14px; box-sizing:border-box; resize:vertical;"></textarea>
                    </div>
                </div>
                <div class="modal-actions vertical">
                    <button type="submit" class="action-btn save-btn">Submit Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Ticket Detail Modal -->
    <div id="ticketDetailModal" class="modal">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h3 id="tdSubject">Ticket</h3>
                <button class="close-modal" id="closeTicketDetail">&times;</button>
            </div>
            <div class="modal-body">
                <div id="tdMeta" style="font-size:12px; color:#64748b; margin-bottom:12px;"></div>
                <div id="tdThread" style="max-height:260px; overflow-y:auto; margin-bottom:14px;"></div>
                <div class="form-group">
                    <label>Reply</label>
                    <textarea id="tdReply" rows="3" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit; font-size:14px; box-sizing:border-box; resize:vertical;"></textarea>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="tdStatus">
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
            </div>
            <div class="modal-actions vertical">
                <button class="action-btn save-btn" id="tdSendReply">Send Reply</button>
                <button class="action-btn" id="tdUpdateStatus" style="background:#e2e8f0; color:#475569;">Update Status</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast-notification"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
