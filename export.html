<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veri Dışa Aktarma · Excel</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f172a; color: #e2e8f0; margin: 0;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
  }
  .card {
    background: #1e293b; border: 1px solid #334155; border-radius: 16px;
    padding: 32px; width: 100%; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #94a3b8; font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: #cbd5e1; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 11px 13px; border-radius: 9px; border: 1px solid #475569;
    background: #0f172a; color: #fff; font-size: 14px;
  }
  input:focus { outline: none; border-color: #6366f1; }
  button {
    width: 100%; margin-top: 22px; padding: 12px; border: none; border-radius: 9px;
    background: #6366f1; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #4f46e5; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .log {
    margin-top: 20px; font-size: 12.5px; color: #94a3b8; line-height: 1.7;
    background: #0f172a; border: 1px solid #334155; border-radius: 9px; padding: 12px 14px;
    max-height: 220px; overflow-y: auto; white-space: pre-wrap; display: none;
  }
  .log.show { display: block; }
  .ok { color: #4ade80; } .err { color: #f87171; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>📊 Veri Dışa Aktarma</h1>
    <p class="sub">Tüm sistem verilerini tek bir Excel dosyası olarak indirin. Admin hesabıyla giriş yapın.</p>

    <div id="loginBox">
      <label for="email">E-posta</label>
      <input id="email" type="email" autocomplete="username" placeholder="admin@ornek.com">
      <label for="password">Şifre</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
      <button id="loginBtn">Giriş yap ve devam et</button>
    </div>

    <div id="exportBox" class="hidden">
      <p class="sub" id="who"></p>
      <button id="exportBtn">⬇️ Excel olarak indir (.xlsx)</button>
      <button id="logoutBtn" style="background:#334155; margin-top:10px;">Çıkış yap</button>
    </div>

    <div id="log" class="log"></div>
  </div>

  <!-- Firebase (compat SDK, uygulamayla aynı sürüm ailesi) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <!-- SheetJS (Excel oluşturma) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <!-- Proje Firebase config -->
  <script src="js/core/firebase-config.js"></script>

  <script>
    const logEl = document.getElementById('log');
    function log(msg, cls) {
      logEl.classList.add('show');
      const span = document.createElement('div');
      if (cls) span.className = cls;
      span.textContent = msg;
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // İndirilecek koleksiyonlar -> Excel sayfa adı
    const COLLECTIONS = [
      { name: 'reservations',   sheet: 'Rezervasyonlar' },
      { name: 'guestLogs',      sheet: 'Misafir Loglari' },
      { name: 'guestDirectory', sheet: 'Misafir Rehberi' },
      { name: 'systemUsers',    sheet: 'Kullanicilar' },
      { name: 'tickets',        sheet: 'Talepler' },
      { name: 'systemConfig',   sheet: 'Ayarlar' },
    ];

    // Firestore değerlerini Excel için okunur metne çevir
    function flatten(val) {
      if (val === null || val === undefined) return '';
      // Firestore Timestamp
      if (val && typeof val.toDate === 'function') {
        try { return val.toDate().toLocaleString('tr-TR'); } catch (e) { return ''; }
      }
      if (Array.isArray(val)) {
        return val.map(v => (typeof v === 'object' ? JSON.stringify(v) : v)).join(' | ');
      }
      if (typeof val === 'object') return JSON.stringify(val);
      return val;
    }

    async function fetchCollection(col) {
      const snap = await firebase.firestore().collection(col).get();
      const rows = [];
      snap.forEach(doc => {
        const data = doc.data();
        const row = { id: doc.id };
        Object.keys(data).forEach(k => { row[k] = flatten(data[k]); });
        rows.push(row);
      });
      return rows;
    }

    // Tüm satırlardaki anahtarların birleşimini sütun olarak kullan (id öne)
    function unionColumns(rows) {
      const set = new Set(['id']);
      rows.forEach(r => Object.keys(r).forEach(k => set.add(k)));
      return Array.from(set);
    }

    async function doExport() {
      const btn = document.getElementById('exportBtn');
      btn.disabled = true;
      logEl.innerHTML = '';
      try {
        const wb = XLSX.utils.book_new();
        let total = 0;
        for (const c of COLLECTIONS) {
          log('• ' + c.sheet + ' okunuyor...');
          let rows;
          try {
            rows = await fetchCollection(c.name);
          } catch (e) {
            log('  ⚠ ' + c.sheet + ' atlandı (' + e.message + ')', 'err');
            continue;
          }
          const cols = unionColumns(rows);
          const ws = XLSX.utils.json_to_sheet(rows, { header: cols });
          XLSX.utils.book_append_sheet(wb, ws, c.sheet);
          log('  ✓ ' + rows.length + ' kayıt', 'ok');
          total += rows.length;
        }
        const stamp = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(wb, 'stayos-veri-' + stamp + '.xlsx');
        log('Tamamlandı. Toplam ' + total + ' kayıt indirildi.', 'ok');
      } catch (e) {
        log('Hata: ' + e.message, 'err');
      } finally {
        btn.disabled = false;
      }
    }

    function showExportUI(user) {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('exportBox').classList.remove('hidden');
      document.getElementById('who').textContent = 'Giriş yapıldı: ' + user.email;
    }
    function showLoginUI() {
      document.getElementById('exportBox').classList.add('hidden');
      document.getElementById('loginBox').classList.remove('hidden');
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      try {
        await firebase.auth().signInWithEmailAndPassword(email, pass);
      } catch (e) {
        log('Giriş hatası: ' + e.message, 'err');
        btn.disabled = false;
      }
    });

    document.getElementById('exportBtn').addEventListener('click', doExport);
    document.getElementById('logoutBtn').addEventListener('click', () => firebase.auth().signOut());

    firebase.auth().onAuthStateChanged(user => {
      document.getElementById('loginBtn').disabled = false;
      if (user) showExportUI(user); else showLoginUI();
    });
  </script>
</body>
</html>
