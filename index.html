<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayOS — Otel Yönetim Platformu</title>
    <meta name="description" content="StayOS — oteller için modern resepsiyon, concierge ve misafir yönetim platformu. Çok yakında.">
    <meta property="og:title" content="StayOS — Otel Yönetim Platformu">
    <meta property="og:description" content="Oteliniz için modern resepsiyon, concierge ve misafir yönetim platformu. Çok yakında.">
    <meta name="theme-color" content="#0b1120">
    <link rel="icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0b1120;
            --accent: #6366f1;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        html, body { height: 100%; }
        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 20px;
            overflow: hidden;
            position: relative;
        }
        /* Ambient glow */
        body::before, body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .35;
            z-index: 0;
        }
        body::before { width: 460px; height: 460px; background: #6366f1; top: -160px; left: -120px; }
        body::after  { width: 420px; height: 420px; background: #0ea5e9; bottom: -160px; right: -120px; opacity: .25; }

        .content { position: relative; z-index: 1; max-width: 620px; animation: rise .9s ease both; }
        @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

        .logo { width: 96px; height: 96px; object-fit: contain; border-radius: 22px; margin-bottom: 26px;
                box-shadow: 0 18px 50px rgba(0,0,0,.45); }

        .wordmark {
            font-size: clamp(40px, 9vw, 72px);
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1;
            margin-bottom: 18px;
        }
        .wordmark span { color: var(--accent); }

        .badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            background: rgba(99,102,241,.12);
            border: 1px solid rgba(99,102,241,.3);
            padding: 7px 16px;
            border-radius: 999px;
            margin-bottom: 30px;
        }

        .tagline {
            font-size: clamp(16px, 2.6vw, 20px);
            font-weight: 300;
            color: var(--muted);
            line-height: 1.6;
            max-width: 460px;
            margin: 0 auto 40px;
        }

        .features { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; margin-bottom: 44px; }
        .feature { font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
        .feature::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

        .login-btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 13px 30px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 12px;
            transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
            box-shadow: 0 10px 30px rgba(99,102,241,.35);
        }
        .login-btn:hover { background: #4f46e5; transform: translateY(-2px); box-shadow: 0 14px 38px rgba(99,102,241,.45); }
        .login-btn svg { width: 18px; height: 18px; }

        footer {
            position: relative; z-index: 1;
            margin-top: 56px;
            font-size: 12.5px;
            color: #475569;
        }
        footer a { color: #64748b; text-decoration: none; }
        footer a:hover { color: var(--muted); }
    </style>
</head>
<body>
    <div class="content">
        <img src="logo.png" alt="StayOS" class="logo">
        <div class="badge">Çok Yakında</div>
        <h1 class="wordmark">Stay<span>OS</span></h1>
        <p class="tagline">
            Oteliniz için modern resepsiyon, concierge ve misafir yönetim platformu.
            Tek panelde rezervasyon, misafir takibi ve operasyon.
        </p>
        <div class="features">
            <div class="feature">Rezervasyon Yönetimi</div>
            <div class="feature">Concierge &amp; CRM</div>
            <div class="feature">Misafir Takibi</div>
        </div>
        <a href="login.html" class="login-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                <polyline points="10 17 15 12 10 7"></polyline>
                <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            Personel Girişi
        </a>
    </div>
    <footer>
        © <span id="year"></span> StayOS · <a href="login.html">Giriş</a>
    </footer>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
