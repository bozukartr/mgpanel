<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StayOS</title>
    <meta name="description" content="StayOS — otel yönetim platformu.">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            padding: 24px;
        }
        .s-logo-link {
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 0;
        }
        .s-logo {
            width: 180px;
            max-width: 60vw;
            height: auto;
            user-select: none;
            filter: brightness(0) invert(1);
            opacity: 0.95;
            transition: opacity .2s ease;
        }
        .s-logo-link:hover .s-logo { opacity: 1; }
    </style>
</head>
<body>
    <a href="login.html" class="s-logo-link" aria-label="Giriş">
        <img src="logo.png" alt="StayOS" class="s-logo">
    </a>
</body>
</html>
