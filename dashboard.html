<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Panel · StayOS</title>
    <link rel="stylesheet" href="css/modules/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/core/embed.css">
    <script src="js/core/embed.js"></script>
</head>
<body>
    <header class="dash-header">
        <div class="dash-logo"><img src="logo.png" alt="StayOS"><span>StayOS</span></div>
        <nav class="dash-nav">
            <a href="dashboard.html" class="active">Panel</a>
            <a href="concierge.html" data-module="concierge">Concierge</a>
            <a href="panel.html" data-module="guestIssues">Misafir Kayıtları</a>
            <a href="crm.html" data-module="crm">CRM</a>
            <a href="admin.html" class="admin-only" id="dashAdminNav" style="display:none;">Ayarlar</a>
        </nav>
        <div class="dash-user">
            <div id="rt-bell"></div>
            <div class="dash-chip">
                <div class="av" id="dashAvatar">··</div>
                <div class="meta"><b id="dashUser">—</b><span id="dashRole">—</span></div>
            </div>
            <button class="dash-logout" id="dashLogout" title="Çıkış" aria-label="Çıkış">⎋</button>
        </div>
    </header>

    <main class="dash-main">
        <div class="dash-top">
            <div>
                <h1 id="dashGreet">Merhaba 👋</h1>
                <p id="dashDate">—</p>
            </div>
        </div>

        <section class="kpi-grid" id="kpiGrid">
            <!-- Aktif Concierge Talepleri -->
            <div class="kpi" data-module="concierge">
                <div class="kpi-ico indigo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 20a6 6 0 0 1 12 0"/><path d="M12 4v3"/><path d="M10 4h4"/></svg>
                </div>
                <div class="kpi-body">
                    <div class="kpi-val" id="kpiResOpen">—</div>
                    <div class="kpi-label">Açık Concierge Talebi</div>
                    <div class="kpi-sub mut" id="kpiResOverdue"><span class="dot"></span>—</div>
                </div>
            </div>
            <!-- Açık Şikayetler -->
            <div class="kpi" data-module="guestIssues">
                <div class="kpi-ico amber">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </div>
                <div class="kpi-body">
                    <div class="kpi-val" id="kpiComplaints">—</div>
                    <div class="kpi-label">Açık Şikayet</div>
                    <div class="kpi-sub mut" id="kpiComplaintsSub"><span class="dot"></span>—</div>
                </div>
            </div>
            <!-- Ortalama Çözüm Süresi -->
            <div class="kpi" data-module="guestIssues">
                <div class="kpi-ico emerald">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
                </div>
                <div class="kpi-body">
                    <div class="kpi-val" id="kpiAvg">—</div>
                    <div class="kpi-label">Ort. Çözüm Süresi</div>
                    <div class="kpi-sub mut" id="kpiAvgSub"><span class="dot"></span>son 30 gün</div>
                </div>
            </div>
            <!-- En Yoğun Departman -->
            <div class="kpi" data-module="guestIssues">
                <div class="kpi-ico sky">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <div class="kpi-body">
                    <div class="kpi-val" id="kpiDept" style="font-size:24px; letter-spacing:-.4px;">—</div>
                    <div class="kpi-label">En Yoğun Departman</div>
                    <div class="kpi-sub mut" id="kpiDeptSub"><span class="dot"></span>—</div>
                </div>
            </div>
        </section>

        <section class="dash-feed-card">
            <div class="feed-head"><h2>Son Aktiviteler</h2><span class="live">Canlı</span></div>
            <div class="feed-list" id="feedList"><div class="dash-empty dash-skeleton">Yükleniyor…</div></div>
        </section>
    </main>

    <!-- Bottom nav (mobile only) -->
    <nav class="dash-bnav">
        <button class="dash-bn active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            <span>Panel</span>
        </button>
        <button class="dash-bn" data-module="concierge" onclick="window.location.href='concierge.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 20a6 6 0 0 1 12 0"/><path d="M12 4v3"/><path d="M10 4h4"/></svg>
            <span>Concierge</span>
        </button>
        <button class="dash-bn" data-module="guestIssues" onclick="window.location.href = window.innerWidth > 880 ? 'panel.html' : 'panel-mobile.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>Kayıtlar</span>
        </button>
        <button class="dash-bn" data-module="crm" onclick="window.location.href='crm.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>CRM</span>
        </button>
    </nav>

    <!-- Firebase + app -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="js/core/firebase-config.js"></script>
    <script src="js/core/maintenance-guard.js"></script>
    <script src="js/core/modules.js"></script>
    <script src="js/core/realtime.js"></script>
    <script src="js/core/pwa.js"></script>
    <script src="js/modules/dashboard.js"></script>
</body>
</html>
