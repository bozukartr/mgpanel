<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Bakımdayız · StayOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Outfit', system-ui, sans-serif; color: #0f172a; min-height: 100vh;
        display: flex; align-items: center; justify-content: center; padding: 28px; text-align: center;
        background:
            radial-gradient(900px 500px at 50% -10%, rgba(99,102,241,.16), transparent 60%),
            radial-gradient(700px 400px at 90% 110%, rgba(6,182,212,.12), transparent 60%),
            #f7f9fc;
    }
    .box { max-width: 520px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; margin-bottom: 30px; }
    .brand img { height: 30px; }
    .ico {
        width: 92px; height: 92px; border-radius: 26px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #eef2ff, #fff); box-shadow: 0 18px 50px rgba(99,102,241,.18); font-size: 44px;
    }
    h1 { font-size: 30px; font-weight: 800; letter-spacing: -.6px; margin-bottom: 12px; }
    p { font-size: 16px; color: #5b6b85; line-height: 1.6; }
    .chip {
        display: inline-flex; align-items: center; gap: 8px; margin-top: 26px; padding: 10px 16px; border-radius: 999px;
        background: #fff; border: 1px solid #e6eaf2; box-shadow: 0 6px 20px rgba(15,23,42,.05); font-size: 13.5px; font-weight: 600; color: #475569;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 0 4px rgba(245,158,11,.18); }
    a.mail { color: #4f46e5; font-weight: 700; text-decoration: none; }
    .foot { margin-top: 34px; font-size: 12.5px; color: #94a3b8; }
</style>
</head>
<body>
    <div class="box">
        <div class="brand"><img src="logo.png" alt="StayOS">StayOS</div>
        <div class="ico">🛠️</div>
        <h1>Kısa bir bakımdayız</h1>
        <p>Sistemlerimizi daha iyi bir deneyim için güncelliyoruz. Çok kısa süre içinde tekrar yayında olacağız. Anlayışınız için teşekkürler.</p>
        <div class="chip"><span class="dot"></span> Planlı bakım sürüyor</div>
        <div class="foot">Acil durumlar için: <a class="mail" href="mailto:bu.gol@outlook.com">bu.gol@outlook.com</a></div>
    </div>
</body>
</html>
