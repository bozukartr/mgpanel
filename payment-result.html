<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödeme Sonucu · StayOS</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f8fb;color:#0f172a;
        min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
    .card{background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:40px 32px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(16,24,40,.08)}
    .ico{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
    .ok .ico{background:#dcfce7;color:#16a34a}.fail .ico{background:#fee2e2;color:#dc2626}
    .ico svg{width:32px;height:32px}
    h1{font-size:20px;margin-bottom:8px}
    p{font-size:14px;color:#64748b;line-height:1.6}
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="ico" id="ico"></div>
        <h1 id="title">İşleniyor…</h1>
        <p id="msg">Lütfen bekleyin.</p>
    </div>
    <script>
        var ok = new URLSearchParams(location.search).get('status') === 'ok';
        var card = document.getElementById('card');
        card.className = 'card ' + (ok ? 'ok' : 'fail');
        document.getElementById('ico').innerHTML = ok
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        document.getElementById('title').textContent = ok ? 'Ödeme Başarılı' : 'Ödeme Başarısız';
        document.getElementById('msg').textContent = ok
            ? 'Aboneliğiniz güncellendi. Bu pencereyi kapatabilirsiniz.'
            : 'Ödeme tamamlanamadı. Lütfen tekrar deneyin veya farklı bir kart kullanın.';
    </script>
</body>
</html>
