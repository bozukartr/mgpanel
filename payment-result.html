<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödeme Sonucu · StayOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Outfit', system-ui, -apple-system, sans-serif; background: #f7f5ef; color: #211f1a;
        min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center;
        -webkit-font-smoothing: antialiased;
    }
    .card { background: #fff; border: 1px solid #ece5d6; border-radius: 22px; padding: 44px 34px; max-width: 400px; width: 100%;
        box-shadow: 0 24px 60px rgba(45,40,28,.10); }
    .ico { width: 66px; height: 66px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; }
    .ok .ico { background: #e7f1ed; color: #0f6b54; }
    .fail .ico { background: #fdeceb; color: #d4463c; }
    .ico svg { width: 30px; height: 30px; }
    .eyebrow { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 2.4px; text-transform: uppercase;
        margin-bottom: 14px; color: #8a8175; }
    h1 { font-size: 25px; font-weight: 300; letter-spacing: -.4px; margin-bottom: 10px; color: #1c1a16; }
    p { font-size: 14.5px; color: #7c776b; line-height: 1.65; max-width: 30ch; margin: 0 auto; }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="ico" id="ico"></div>
        <span class="eyebrow">StayOS · Ödeme</span>
        <h1 id="title">İşleniyor…</h1>
        <p id="msg">Lütfen bekleyin.</p>
    </div>
    <script>
        var ok = new URLSearchParams(location.search).get('status') === 'ok';
        var card = document.getElementById('card');
        card.className = 'card ' + (ok ? 'ok' : 'fail');
        document.getElementById('ico').innerHTML = ok
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        document.getElementById('title').textContent = ok ? 'Ödeme Başarılı' : 'Ödeme Başarısız';
        document.getElementById('msg').textContent = ok
            ? 'Aboneliğiniz güncellendi. Bu pencereyi kapatabilirsiniz.'
            : 'Ödeme tamamlanamadı. Lütfen tekrar deneyin veya farklı bir kart kullanın.';

        // This page loads inside the admin's payment iframe (same origin) —
        // notify the panel so it can close the modal and refresh.
        try { window.parent.postMessage({ source: 'stayos-payment', status: ok ? 'ok' : 'fail' }, '*'); } catch (e) {}
    </script>
</body>
</html>
