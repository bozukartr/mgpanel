<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>Talep Oluştur · StayOS</title>
    <link rel="stylesheet" href="guest-order.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- ── Header ── -->
    <header class="go-header">
        <div class="go-hotel">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg>
            <span id="goHotelName">StayOS</span>
        </div>
        <h1>Size nasıl yardımcı olabiliriz?</h1>
        <div class="go-room-chip" id="goRoomChip" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span id="goRoomLabel">Oda —</span>
        </div>
    </header>

    <!-- ── Catalog (browse) view ── -->
    <main id="goCatalogView">
        <nav class="go-cats" id="goCats"></nav>
        <div class="go-body" id="goBody">
            <div class="go-state" id="goLoading">
                <div class="go-spinner"></div>
                <p>Talepler yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- ── Floating cart bar ── -->
    <button class="go-cartbar" id="goCartBar">
        <div class="go-cb-left">
            <span class="go-cb-count" id="goCbCount">0</span>
            <div class="go-cb-label">
                <b>Sepetim</b>
                <span id="goCbSub">talep eklendi</span>
            </div>
        </div>
        <span class="go-cb-go">
            Devam Et
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
    </button>

    <!-- ── Cart bottom sheet ── -->
    <div class="go-backdrop" id="goBackdrop"></div>
    <section class="go-sheet" id="goSheet" aria-hidden="true">
        <div class="go-sheet-pill"></div>
        <div class="go-sheet-head">
            <h2>Sepetim</h2>
            <button class="go-sheet-close" id="goSheetClose" aria-label="Kapat">✕</button>
        </div>
        <div class="go-sheet-scroll" id="goCartList"></div>
        <div class="go-sheet-foot">
            <div class="go-field go-guest-name">
                <label for="goGuestName">Adınız (opsiyonel)</label>
                <input type="text" id="goGuestName" placeholder="Örn. Ahmet Y." maxlength="60" autocomplete="name">
            </div>
            <button class="go-submit" id="goSubmit">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                Sipariş Ver
            </button>
        </div>
    </section>

    <!-- ── Tracking view ── -->
    <main id="goTrackView" class="go-hidden">
        <div class="go-track" id="goTrackBody"></div>
    </main>

    <!-- ── Toast ── -->
    <div class="go-toast" id="goToast"></div>

    <!-- Firebase + app -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="guest-order.js"></script>
</body>

</html>
