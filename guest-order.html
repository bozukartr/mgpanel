<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#eef2ff">
    <title>Talep Oluştur · StayOS</title>
    <link rel="stylesheet" href="guest-order.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- ── Catalog (browse) view ── -->
    <main id="goCatalogView">
        <!-- Header -->
        <header class="go-header">
            <div class="go-topbar">
                <div class="go-hotel">
                    <span class="go-hotel-ico">
                        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg>
                    </span>
                    <span id="goHotelName">StayOS</span>
                </div>
                <div class="go-top-actions">
                    <button class="go-ic" aria-label="Bildirimler">
                        <span class="go-ic-dot"></span>
                        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    </button>
                    <button class="go-ic" id="goTrackIc" aria-label="Taleplerim">
                        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </button>
                </div>
            </div>
            <h1 class="go-title">Size nasıl yardımcı olabiliriz?</h1>
            <div class="go-room-chip" id="goRoomChip" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span id="goRoomLabel">Oda —</span>
            </div>
            <div class="go-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="goSearch" placeholder="Talep ara..." autocomplete="off">
            </div>
        </header>

        <!-- Category tabs -->
        <nav class="go-cats" id="goCats"></nav>

        <div class="go-scroll">
            <!-- Home extras (banner, recommended, popular) -->
            <div id="goHome"></div>
            <!-- Full category sections / search results -->
            <div class="go-body" id="goBody">
                <div class="go-spinner"></div>
            </div>
        </div>
    </main>

    <!-- ── Floating cart bar ── -->
    <button class="go-cartbar" id="goCartBar">
        <div class="go-cb-left">
            <span class="go-cb-count">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                <b id="goCbCount">0</b>
            </span>
            <div class="go-cb-label">
                <b>Sepetim</b>
                <span id="goCbSub">talep eklendi</span>
            </div>
        </div>
        <span class="go-cb-go">
            Devam Et
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
    </button>

    <!-- ── Cart bottom sheet ── -->
    <div class="go-backdrop" id="goBackdrop"></div>
    <section class="go-sheet" id="goSheet" aria-hidden="true">
        <div class="go-sheet-pill"></div>
        <div class="go-sheet-head">
            <h2>Sepetim</h2>
            <button class="go-sheet-close" id="goSheetClose" aria-label="Kapat">✕</button>
        </div>
        <div class="go-sheet-scroll" id="goCartList"></div>
        <div class="go-sheet-foot">
            <div class="go-field go-guest-name">
                <label for="goGuestName">Adınız (opsiyonel)</label>
                <input type="text" id="goGuestName" placeholder="Örn. Ahmet Y." maxlength="60" autocomplete="name">
            </div>
            <button class="go-submit" id="goSubmit">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                Sipariş Ver
            </button>
        </div>
    </section>

    <!-- ── Tracking view ── -->
    <main id="goTrackView" class="go-hidden">
        <div class="go-track" id="goTrackBody"></div>
    </main>

    <!-- ── Toast ── -->
    <div class="go-toast" id="goToast"></div>

    <!-- Firebase + app -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="guest-order.js"></script>
</body>

</html>
