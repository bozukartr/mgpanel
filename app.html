<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Hotizy</title>
    <script src="js/core/theme.js?v=20261112i"></script>
    <link rel="stylesheet" href="css/core/app-shell.css?v=20261112m">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/core/theme-dark-base.css?v=20261112i">
    <link rel="stylesheet" href="css/dark/app-shell.dark.css?v=20261112m">
    <link rel="stylesheet" href="css/dark/realtime.dark.css?v=20261112i">
</head>
<body>
    <div class="sh-app">
        <header class="sh-header">
            <!-- Mobil modül düğmesi: alt nav bar kaldırıldı, tüm rotalar bu
                 çekmeceden açılır (yalnızca ≤880px'te görünür). -->
            <button class="sh-menu" id="shMenuBtn" aria-label="Modüller" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
            </button>
            <div class="sh-logo"><img src="logo.png" alt="Hotizy"><span>Hotizy</span></div>
            <nav class="sh-nav">
                <button class="sh-tab active" data-route="dashboard" data-ctx="hotel">Panel</button>
                <button class="sh-tab" data-route="concierge" data-module="concierge" data-ctx="hotel">Concierge</button>
                <button class="sh-tab" data-route="kayitlar" data-module="guestIssues" data-ctx="hotel">Misafir Kayıtları</button>
                <button class="sh-tab" data-route="raporlar" data-module="reports">Raporlar</button>
                <button class="sh-tab" data-route="crm" data-module="crm" data-ctx="hotel">CRM</button>
                <button class="sh-tab" data-route="restoran" data-module="restaurant" data-ctx="fnb">Restoran</button>
                <button class="sh-tab sh-orders" data-action="orders" data-ctx="hotel">Talepler</button>
                <a class="sh-tab admin-only" id="shAdmin" href="admin" style="display:none;">Ayarlar</a>
            </nav>
            <!-- Genel arama: oda numarası / misafir (js/core/shell-search.js) -->
            <button class="sh-search" id="shSearchBtn" data-ctx="hotel" hidden aria-label="Oda veya misafir ara">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <span>Oda veya misafir ara</span><kbd>Ctrl K</kbd>
            </button>
            <div class="sh-user">
                <div id="rt-bell"></div>
                <!-- Profil menüsü (js/core/shell-profile.js): görünüm, şifre, Face ID,
                     cihaz bildirimleri, kısayollar, çıkış -->
                <button class="sh-chip" id="shProfileBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="shProfileMenu" title="Hesabım">
                    <span class="av" id="shAvatar">··</span>
                    <span class="meta"><b id="shUser">—</b><span id="shRole">—</span></span>
                    <svg class="sh-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </button>
            </div>
        </header>
        <div class="pm-scrim" id="shProfileScrim" hidden></div>
        <div class="pm" id="shProfileMenu" role="menu" aria-label="Hesabım" hidden>
            <div class="pm-head">
                <span class="av" id="pmAv">··</span>
                <span class="pm-who"><b id="pmName">—</b><small id="pmRole">—</small></span>
            </div>
            <div class="pm-sec">
                <div class="pm-label">Görünüm</div>
                <div class="pm-seg" role="radiogroup" aria-label="Görünüm">
                    <button type="button" role="radio" data-theme="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Açık</span></button>
                    <button type="button" role="radio" data-theme="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Koyu</span></button>
                    <button type="button" role="radio" data-theme="auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Sistem</span></button>
                </div>
            </div>
            <div class="pm-list">
                <button type="button" class="pm-item" role="menuitem" id="pmPassword"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Şifremi değiştir</span></button>
                <button type="button" class="pm-item" role="menuitem" id="pmFaceId" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M3 17v2a2 2 0 0 0 2 2h2"/><path d="M9 9v1M15 9v1"/><path d="M12 9v4h-1"/><path d="M9.5 16a3.5 3.5 0 0 0 5 0"/></svg><span id="pmFaceIdLabel">Face ID</span><em class="pm-meta" id="pmFaceIdMeta"></em></button>
                <button type="button" class="pm-item" role="menuitem" id="pmPush"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>Cihaz bildirimleri</span><em class="pm-meta" id="pmPushMeta"></em></button>
                <button type="button" class="pm-item pm-desk" role="menuitem" id="pmKeys"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg><span>Klavye kısayolları</span><kbd>?</kbd></button>
            </div>
            <button type="button" class="pm-item pm-out" role="menuitem" id="shLogout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg><span>Çıkış yap</span></button>
        </div>

        <div class="sh-content">
            <iframe id="shFrame" class="sh-frame" title="İçerik"></iframe>
            <div class="sh-loading" id="shLoading"><div class="sh-spin"></div></div>
        </div>
        <!-- Mobil alt sekme çubuğu (≤880px): role göre en sık 4 hedef + Menü.
             app-shell.js buildBottomBar doldurur; F&B girişinde gösterilmez. -->
        <nav class="sh-bottom" id="shBottom" aria-label="Hızlı geçiş"></nav>

        <!-- Mobil modül çekmecesi (alt nav bar'ın yerine).
             Satırlar kabuk sekmeleriyle AYNI data-route/data-module/data-ctx
             niteliklerini taşır; app-shell.js tek delegasyon döngüsüyle
             hepsini yönetir. -->
        <div class="sh-scrim" id="shScrim"></div>
        <nav class="sh-drawer" id="shDrawer" aria-label="Modüller">
            <button class="sh-dr" data-route="dashboard" data-ctx="hotel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                <span>Panel</span>
            </button>
            <button class="sh-dr" data-route="concierge" data-module="concierge" data-ctx="hotel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 20a6 6 0 0 1 12 0"/><path d="M12 4v3"/><path d="M10 4h4"/></svg>
                <span>Concierge</span>
            </button>
            <button class="sh-dr" data-route="kayitlar" data-module="guestIssues" data-ctx="hotel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span>Misafir Kayıtları</span>
            </button>
            <button class="sh-dr" data-route="raporlar" data-module="reports">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/></svg>
                <span>Raporlar</span>
            </button>
            <button class="sh-dr" data-route="crm" data-module="crm" data-ctx="hotel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>CRM</span>
            </button>
            <button class="sh-dr" data-route="restoran" data-module="restaurant" data-ctx="fnb">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7a3 3 0 0 0 6 0V2"/><path d="M6 2v20"/><path d="M16 2v20"/><path d="M16 11h4a2 2 0 0 0-2-9"/></svg>
                <span>Restoran</span>
            </button>
            <button class="sh-dr sh-orders" data-action="orders" data-ctx="hotel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                <span>QR Talepleri</span>
            </button>
            <a class="sh-dr admin-only" id="shAdminMob" href="admin" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.4.66.73.86.3.19.65.29 1 .29H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>Ayarlar</span>
            </a>
        </nav>
    </div>

    <!-- Firebase + app -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-messaging.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-functions.js" crossorigin="anonymous"></script>
    <script src="js/core/firebase-config.js"></script>
    <script src="js/core/monitor.js"></script>
    <script src="js/core/maintenance-guard.js"></script>
    <script src="js/core/modules.js"></script>
    <script src="js/core/realtime.js"></script>
    <script src="js/core/pwa.js"></script>
    <script src="js/core/push.js"></script>
    <script src="js/core/app-shell.js?v=20261112l"></script>
    <script src="js/core/shell-search.js?v=20261112c"></script>
    <script src="js/core/shell-keys.js?v=20261112d"></script>
    <script src="js/core/passkey.js?v=20261112j"></script>
    <script src="js/core/shell-profile.js?v=20261112j"></script>
    <script src="js/core/shell-lock.js?v=20261112k"></script>
</body>
</html>
