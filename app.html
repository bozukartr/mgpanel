<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>StayOS</title>
    <link rel="stylesheet" href="css/core/app-shell.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="sh-app">
        <header class="sh-header">
            <div class="sh-logo"><img src="logo.png" alt="StayOS"><span>StayOS</span></div>
            <nav class="sh-nav">
                <button class="sh-tab active" data-route="dashboard">Panel</button>
                <button class="sh-tab" data-route="concierge" data-module="concierge">Concierge</button>
                <button class="sh-tab" data-route="kayitlar" data-module="guestIssues">Misafir Kayıtları</button>
                <button class="sh-tab" data-route="crm" data-module="crm">CRM</button>
                <button class="sh-tab sh-orders" data-action="orders">Talepler</button>
                <a class="sh-tab admin-only" id="shAdmin" href="admin.html" style="display:none;">Ayarlar</a>
            </nav>
            <div class="sh-user">
                <div id="rt-bell"></div>
                <div class="sh-chip">
                    <div class="av" id="shAvatar">··</div>
                    <div class="meta"><b id="shUser">—</b><span id="shRole">—</span></div>
                </div>
                <button class="sh-logout" id="shLogout" title="Çıkış" aria-label="Çıkış">⎋</button>
            </div>
        </header>

        <div class="sh-content">
            <iframe id="shFrame" class="sh-frame" title="İçerik"></iframe>
            <div class="sh-loading" id="shLoading"><div class="sh-spin"></div></div>
        </div>

        <nav class="sh-bnav">
        <button class="sh-bn active" data-route="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            <span>Panel</span>
        </button>
        <button class="sh-bn" data-route="concierge" data-module="concierge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 20a6 6 0 0 1 12 0"/><path d="M12 4v3"/><path d="M10 4h4"/></svg>
            <span>Concierge</span>
        </button>
        <button class="sh-bn" data-route="kayitlar" data-module="guestIssues">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>Kayıtlar</span>
        </button>
        <button class="sh-bn" data-route="crm" data-module="crm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>CRM</span>
        </button>
        <button class="sh-bn sh-orders" data-action="orders">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <span>Talepler</span>
        </button>
        </nav>
    </div>

    <!-- Firebase + app -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-messaging.js"></script>
    <script src="js/core/firebase-config.js"></script>
    <script src="js/core/maintenance-guard.js"></script>
    <script src="js/core/modules.js"></script>
    <script src="js/core/realtime.js"></script>
    <script src="js/core/pwa.js"></script>
    <script src="js/core/push.js"></script>
    <script src="js/core/app-shell.js"></script>
</body>
</html>
