<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Misafir Kayıtları · StayOS</title>
    <link rel="stylesheet" href="mobile.css">
    <!-- Match the Concierge console's indigo brand accent -->
    <style>:root { --accent: #6366f1; }</style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PDF & Excel Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="embed.css">
    <script src="embed.js"></script>
</head>
<body>

    <!-- ═══ SCREEN: ISSUES FEED ═══════════════════════════════ -->
    <div class="screen active" id="screen-issues">

        <!-- Top Bar -->
        <header class="app-header">
            <div class="app-header-left">
                <img src="logo.png" alt="Logo" class="app-logo">
                <span class="app-brand">StayOS</span>
            </div>
            <div class="app-header-right">
                <span class="app-username" id="mob-displayUsername"></span>
                <div id="rt-bell"></div>
                <button class="app-icon-btn" id="mob-reportsBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                </button>
                <button class="app-icon-btn" id="mob-logoutBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <!-- Stats Strip -->
        <div class="stats-strip">
            <div class="stat-pill active" data-filter="all">
                <span class="stat-pill-val" id="m-statTotal">0</span>
                <span class="stat-pill-label">Toplam</span>
            </div>
            <div class="stat-pill following" data-filter="open">
                <span class="stat-pill-val" id="m-statFollowing">0</span>
                <span class="stat-pill-label">Açık</span>
            </div>
            <div class="stat-pill solved" data-filter="solved">
                <span class="stat-pill-val" id="m-statSolved">0</span>
                <span class="stat-pill-label">Tamamlandı</span>
            </div>
            <div class="stat-pill overdue" data-filter="overdue">
                <span class="stat-pill-val" id="m-statOverdue">0</span>
                <span class="stat-pill-label">Geciken</span>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <div class="search-input-wrap">
                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="mob-search" placeholder="Search issues…" autocomplete="off">
            </div>
            <input type="date" id="mob-dateFilter" class="date-input">
        </div>

        <!-- Issues Feed -->
        <div class="feed" id="mob-feed">
            <!-- Cards injected by JS -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="mob-emptyState" style="display:none">
            <p>📋</p>
            <span>No issues found</span>
        </div>
    </div>


    <!-- ═══ BOTTOM NAV ══════════════════════════════════════════ -->
    <nav class="bottom-nav">
        <button class="bnav-btn" onclick="window.location.href='concierge.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
            <span>Concierge</span>
        </button>
        <button class="bnav-btn active" data-screen="screen-issues">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span>Kayıtlar</span>
        </button>
        <button class="bnav-btn" onclick="window.location.href='crm.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>CRM</span>
        </button>
        <button class="bnav-btn" id="mob-adminNav" style="display:none" onclick="window.location.href='admin-mobile.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 10-16 0"/></svg>
            <span>Admin</span>
        </button>
    </nav>

    <!-- ═══ FAB ═════════════════════════════════════════════════ -->
    <button class="fab" id="mob-fab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <!-- ═══ SHEET: NEW ISSUE ═════════════════════════════════════ -->
    <div class="sheet-backdrop" id="newIssueBackdrop"></div>
    <div class="sheet" id="newIssueSheet">
        <div class="sheet-pill"></div>
        <div class="sheet-top">
            <h3 id="ni-sheet-title">Yeni Talep</h3>
            <button class="sheet-close-btn" id="newIssueClose">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="sheet-body">
            <div class="type-toggle" id="ni-typeToggle">
                <button type="button" class="type-opt active" data-type="complaint"><span class="t-emoji">⚠️</span> Şikayet</button>
                <button type="button" class="type-opt" data-type="request"><span class="t-emoji">🛎️</span> Talep</button>
            </div>
            <input type="hidden" id="ni-type" value="complaint">
            <div class="field-row">
                <div class="field-group">
                    <label>Tarih</label>
                    <input type="date" id="ni-date">
                </div>
                <div class="field-group">
                    <label>Oda</label>
                    <input type="text" id="ni-room" placeholder="örn. 205" inputmode="numeric">
                </div>
            </div>
            <div class="field-group">
                <label>Misafir Adı</label>
                <input type="text" id="ni-guest" placeholder="Ad soyad" list="guest-list">
                <datalist id="guest-list"></datalist>
            </div>
            <div class="field-group">
                <label>Departman</label>
                <select id="ni-dept">
                    <option value="Housekeeping">Housekeeping</option>
                    <option value="Front Desk">Front Desk</option>
                    <option value="Concierge">Concierge</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Food &amp; Beverage">Food &amp; Beverage</option>
                    <option value="Reservations">Reservations</option>
                    <option value="Sales &amp; Marketing">Sales &amp; Marketing</option>
                    <option value="Spa">Spa</option>
                    <option value="Watersports">Watersports</option>
                    <option value="Security">Security</option>
                    <option value="Noise">Noise</option>
                    <option value="Transfer">Transfer</option>
                </select>
            </div>
            <div class="field-group">
                <label id="ni-complaintLabel">Şikayet Detayı</label>
                <textarea id="ni-complaint" placeholder="Sorunu açıklayın…" rows="2"></textarea>
            </div>
            <div class="field-group" id="ni-solutionGroup">
                <label>Çözüm</label>
                <textarea id="ni-solution" placeholder="Yapılan işlem…" rows="2"></textarea>
            </div>
            <div class="field-group" id="ni-assigneeGroup" style="display:none;">
                <label>Talebi ata — <span class="assignee-hint">çevrimiçi personel</span></label>
                <div class="assignee-picker" id="ni-assigneePicker"></div>
                <div class="assignee-empty" id="ni-assigneeEmpty" style="display:none;">Şu an çevrimiçi personel yok. Talep atanmadan oluşturulur.</div>
            </div>
            <div id="mob-conflict-alert" style="display:none; margin-bottom:15px; padding:12px; border-radius:8px; font-size:12px; border: 1px solid #fca5a5; background: rgba(239, 68, 68, 0.08); color: #b91c1c; line-height: 1.5;"></div>
            <button class="primary-btn" id="ni-submit">Şikayeti Kaydet</button>
        </div>
    </div>

    <!-- ═══ SHEET: ISSUE DETAIL ══════════════════════════════════ -->
    <div class="sheet-backdrop" id="detailBackdrop"></div>
    <div class="sheet" id="detailSheet">
        <div class="sheet-pill"></div>
        <div class="sheet-top">
            <div>
                <p class="detail-room" id="d-room"></p>
                <h3 class="detail-name" id="d-name"></h3>
            </div>
            <div class="sheet-top-actions">
                <button class="sheet-action-btn" id="d-emailBtn" title="Draft Email">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </button>
                <button class="sheet-action-btn" id="d-editBtn" title="Edit Record">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button class="sheet-close-btn" id="detailClose">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
        </div>
        <div class="sheet-body">
            <!-- Status Toggle -->
            <div class="status-toggle-row">
                <button class="status-toggle-btn" id="d-setFollowing" data-status="Following">
                    <span class="stb-dot"></span>
                    Bekliyor
                </button>
                <button class="status-toggle-btn" id="d-setInProgress" data-status="InProgress">
                    <span class="stb-dot"></span>
                    İşi Üstlen
                </button>
                <button class="status-toggle-btn" id="d-setSolved" data-status="Solved">
                    <span class="stb-dot"></span>
                    Tamamlandı
                </button>
            </div>
            <!-- Info Grid -->
            <div class="detail-grid">
                <div class="detail-field">
                    <label>Department</label>
                    <p id="d-dept"></p>
                </div>
                <div class="detail-field">
                    <label>Date</label>
                    <p id="d-date"></p>
                </div>
                <div class="detail-field">
                    <label>Staff</label>
                    <p id="d-staff"></p>
                </div>
            </div>
            <!-- Complaint / Solution -->
            <div class="detail-section">
                <label>Complaint</label>
                <p id="d-complaint"></p>
            </div>
            <div class="detail-section">
                <label>Solution</label>
                <p id="d-solution"></p>
            </div>
            <!-- Timeline -->
            <div class="timeline-section">
                <label>Updates</label>
                <div class="timeline-list" id="d-timeline"></div>
                <div class="timeline-input-wrap">
                    <textarea id="d-noteInput" placeholder="Add a note…" rows="1"></textarea>
                    <button class="note-post-btn" id="d-postNote">Post</button>
                </div>
            </div>
            <!-- Delete -->
            <button class="danger-btn" id="d-deleteBtn">Delete Record</button>
        </div>
    </div>

    <!-- ═══ SHEET: EDIT RECORD ══════════════════════════════════ -->
    <div class="sheet-backdrop" id="editBackdrop"></div>
    <div class="sheet" id="editSheet">
        <div class="sheet-pill"></div>
        <div class="sheet-top">
            <h3>Edit Record</h3>
            <button class="sheet-close-btn" id="editClose">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="sheet-body">
            <div class="field-row">
                <div class="field-group">
                    <label>Date</label>
                    <input type="date" id="ed-date">
                </div>
                <div class="field-group">
                    <label>Room</label>
                    <input type="text" id="ed-room">
                </div>
            </div>
            <div class="field-group">
                <label>Guest Name</label>
                <input type="text" id="ed-guest">
            </div>
            <div class="field-group">
                <label>Department</label>
                <select id="ed-dept">
                    <option value="Housekeeping">Housekeeping</option>
                    <option value="Front Desk">Front Desk</option>
                    <option value="Concierge">Concierge</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Food &amp; Beverage">Food &amp; Beverage</option>
                    <option value="Reservations">Reservations</option>
                    <option value="Sales &amp; Marketing">Sales &amp; Marketing</option>
                    <option value="Spa">Spa</option>
                    <option value="Watersports">Watersports</option>
                    <option value="Security">Security</option>
                    <option value="Noise">Noise</option>
                    <option value="Transfer">Transfer</option>
                </select>
            </div>
            <div class="field-group">
                <label>Complaint</label>
                <textarea id="ed-complaint" rows="2"></textarea>
            </div>
            <div class="field-group">
                <label>Solution</label>
                <textarea id="ed-solution" rows="2"></textarea>
            </div>
            <button class="primary-btn" id="ed-submit">Save Changes</button>
        </div>
    </div>

    <!-- ═══ DELETE CONFIRM ════════════════════════════════════════ -->
    <div class="sheet-backdrop" id="confirmBackdrop"></div>
    <div class="sheet confirm-sheet" id="confirmSheet">
        <div class="sheet-pill"></div>
        <div class="sheet-body confirm-body">
            <p class="confirm-title">Delete this record?</p>
            <p class="confirm-desc">This action cannot be undone.</p>
            <button class="danger-btn" id="confirmDeleteYes">Yes, Delete</button>
            <button class="secondary-btn" id="confirmDeleteNo">Cancel</button>
        </div>
    </div>

    <!-- ═══ REPORTS SHEET ════════════════════════════════════════ -->
    <div class="sheet-backdrop" id="rptBackdrop"></div>
    <div class="sheet rpt-sheet" id="rptSheet">
        <div class="sheet-pill"></div>
        <div class="sheet-header">
            <h3>📊 Reports Center</h3>
            <button class="sheet-close-btn" id="rptClose">&times;</button>
        </div>
        <div class="sheet-body rpt-body">
            <div class="field-group">
                <label>Report Type</label>
                <select id="mob-reportType">
                    <option value="summary">Daily Summary</option>
                    <option value="department">By Department</option>
                    <option value="dateRange">Date Range</option>
                    <option value="status">By Status</option>
                </select>
            </div>

            <div id="mob-rpt-dateGroup">
                <div class="field-group">
                    <label>From Date</label>
                    <input type="date" id="mob-rpt-from">
                </div>
                <div class="field-group" id="mob-rpt-toGroup">
                    <label>To Date</label>
                    <input type="date" id="mob-rpt-to">
                </div>
            </div>

            <div class="field-group" id="mob-rpt-deptGroup" style="display:none;">
                <label>Select Department</label>
                <select id="mob-rpt-dept">
                    <option value="Housekeeping">Housekeeping</option>
                    <option value="Front Desk">Front Desk</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Food & Beverage">Food & Beverage</option>
                    <option value="Security">Security</option>
                    <option value="Noise">Noise</option>
                    <option value="Transfer">Transfer</option>
                </select>
            </div>

            <div class="rpt-actions">
                <button class="primary-btn excel-btn" id="mob-rpt-excel">Excel Export</button>
                <button class="primary-btn pdf-btn" id="mob-rpt-pdf">PDF Export</button>
            </div>
        </div>
    </div>

    <!-- ═══ TOAST ════════════════════════════════════════════════ -->
    <div class="app-toast" id="mob-toast"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-messaging.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-functions.js"></script>
    <script src="firebase-config.js"></script>
    <script src="realtime.js"></script>
    <script src="pwa.js"></script>
    <script src="push.js"></script>
    <script src="maintenance-guard.js"></script>
    <script src="modules.js"></script>
    <script src="pms.js"></script>
    <script src="mobile.js"></script>
    <script src="guest-orders.js"></script>
    <script src="room-access.js"></script>
</body>
</html>
